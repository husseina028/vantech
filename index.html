<style>
/* =========================================================
   VANTEC Systems — landing page
   Palette: baby blue / white / black
   ========================================================= */
:root{
  --sky:#BFE3FF;
  --sky-2:#E3F3FF;
  --sky-3:#F4FAFF;
  --sky-deep:#86C8F6;
  --ink:#0A0B0D;
  --ink-2:#1A1D22;
  --mute:#5B6570;
  --line:rgba(10,11,13,.1);
  --paper:#fff;
  --r:22px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --font:'Inter',system-ui,sans-serif;
}
html[lang="ar"]{--font:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--sky);color:var(--ink)}

.wrap{width:min(1180px,100% - 48px);margin-inline:auto}

/* ---------- Type ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--mute);letter-spacing:.02em}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;opacity:.6}
h1,h2,h3{font-weight:600;line-height:1.08}
html[lang="en"] h1,html[lang="en"] h2{letter-spacing:-.035em}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.3;letter-spacing:0}
h1{font-size:clamp(40px,6.6vw,84px)}
h2{font-size:clamp(32px,4.4vw,56px)}
h3{font-size:20px}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--mute);max-width:34em}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding-inline:26px;border-radius:999px;font-weight:500;font-size:15px;transition:transform .35s var(--ease),background .3s,box-shadow .3s;will-change:transform;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-2);box-shadow:0 14px 34px -12px rgba(10,11,13,.55)}
.btn-sky{background:var(--sky);color:var(--ink)}
.btn-sky:hover{background:#cfeaff;box-shadow:0 14px 34px -14px rgba(134,200,246,.9)}
.btn-line{border:1px solid var(--line);background:#fff}
.btn-line:hover{border-color:var(--ink)}

/* ---------- Nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .35s,border-color .35s,backdrop-filter .35s;border-bottom:1px solid transparent}
.nav.stuck{background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-color:var(--line)}
.nav-in{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.14em;font-size:15px;direction:ltr}
.wm{display:flex;flex-direction:column;gap:3px;line-height:1}
.wm b{font-weight:700;letter-spacing:.14em;font-size:15px;margin-inline-end:-.14em}
.wm small{display:flex;justify-content:space-between;width:0;min-width:100%;font-size:7.5px;font-weight:500;color:var(--mute)}
.wm s{text-decoration:none}
.logo img{width:36px;height:36px;border-radius:10px;display:block;transition:transform .5s var(--ease)}
.logo:hover img{transform:rotate(-8deg) scale(1.06)}
.menu{display:flex;gap:34px;font-size:14.5px;color:var(--mute)}
.menu a{position:relative;transition:color .25s}
.menu a:hover{color:var(--ink)}
.menu a::after{content:"";position:absolute;inset-inline:0;bottom:-6px;height:1px;background:var(--ink);transform:scaleX(0);transition:transform .35s var(--ease);transform-origin:left}
html[dir="rtl"] .menu a::after{transform-origin:right}
.menu a:hover::after{transform:scaleX(1)}
.nav-r{display:flex;align-items:center;gap:12px}
.lang{height:40px;min-width:48px;padding-inline:14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;background:#fff;transition:border-color .25s,background .25s}
.lang:hover{border-color:var(--ink)}
.nav .btn{height:40px;padding-inline:18px;font-size:14px}
@media(max-width:860px){.menu{display:none}}
@media(max-width:480px){.nav .btn span{display:none}.nav .btn{padding-inline:13px}}

/* ---------- Hero ---------- */
.hero{position:relative;padding:150px 0 90px;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,var(--sky-2) 0%,#fff 78%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;will-change:transform}
.orb.a{width:520px;height:520px;background:var(--sky);top:-160px;inset-inline-end:-120px;animation:drift 18s ease-in-out infinite}
.orb.b{width:380px;height:380px;background:#cde9ff;top:260px;inset-inline-start:-140px;animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,50px) scale(1.12)}}
.grid-bg{position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.35;mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000,transparent 75%)}

.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{margin:22px 0 24px}
.hero .lead{margin-bottom:36px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.hero-note{margin-top:28px;display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mute)}
.pulse{width:8px;height:8px;border-radius:50%;background:#2f9e6b;position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2s var(--ease) infinite}
@keyframes ping{to{transform:scale(3.2);opacity:0}}

.word{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.word>span{display:inline-block;transform:translateY(110%);animation:up .9s var(--ease) forwards;animation-delay:calc(var(--i)*60ms + 150ms)}
@keyframes up{to{transform:none}}

/* hero visual */
.stage{position:relative;height:540px;perspective:1200px}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s ease-out}
.browser{position:absolute;inset-inline-start:0;top:30px;width:88%;background:#fff;border-radius:20px;border:1px solid var(--line);box-shadow:0 40px 80px -30px rgba(10,11,13,.28),0 0 0 8px rgba(255,255,255,.5);overflow:hidden;animation:float 8s ease-in-out infinite;direction:ltr}
.bar{height:40px;display:flex;align-items:center;gap:7px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--sky-3)}
.bar i{width:9px;height:9px;border-radius:50%;background:#d5dde5}
.bar b{margin-inline-start:12px;flex:1;height:22px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:400;color:var(--mute);display:flex;align-items:center;padding-inline:10px}
.page{padding:26px}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef3f7 0%,#f8fbfd 50%,#eef3f7 100%);background-size:200% 100%;animation:shimmer 2.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.sk.h{height:22px;width:72%;background:var(--ink);animation:none;border-radius:7px;margin-bottom:12px}
.sk.h2{height:22px;width:48%;background:var(--ink);animation:none;border-radius:7px;margin-bottom:18px}
.sk.s{width:86%;margin-bottom:8px}
.sk.s2{width:62%;margin-bottom:22px}
.pill{display:inline-block;height:34px;width:120px;border-radius:999px;background:var(--sky);margin-bottom:26px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{aspect-ratio:1/1.05;border-radius:14px;background:var(--sky-2);position:relative;overflow:hidden}
.tile:nth-child(2){background:var(--ink)}
.tile:nth-child(3){background:var(--sky)}
.tile::after{content:"";position:absolute;inset:auto 12px 12px 12px;height:8px;border-radius:4px;background:rgba(255,255,255,.7)}
.tile:nth-child(2)::after{background:rgba(255,255,255,.25)}

.phone{position:absolute;inset-inline-end:0;bottom:0;width:232px;background:var(--ink);border-radius:36px;padding:9px;box-shadow:0 50px 70px -28px rgba(10,11,13,.55);animation:float 7s ease-in-out -2s infinite;transform:translateZ(60px)}
.screen{background:#fff;border-radius:28px;padding:22px 16px 18px;min-height:350px}
.notch{width:70px;height:6px;border-radius:4px;background:var(--ink);margin:-8px auto 16px;opacity:.9}
.ph-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ph-h strong{font-size:16px;font-weight:600}
.ph-h em{font-style:normal;font-size:10.5px;background:var(--sky);padding:3px 9px;border-radius:99px;font-weight:500}
.cats{display:flex;gap:6px;margin-bottom:14px;font-size:10.5px}
.cats span{padding:5px 11px;border-radius:99px;background:var(--sky-3);color:var(--mute)}
.cats span:first-child{background:var(--ink);color:#fff}
.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line);opacity:0;transform:translateY(8px);animation:pop .7s var(--ease) forwards}
.item:nth-of-type(1){animation-delay:1.1s}.item:nth-of-type(2){animation-delay:1.25s}.item:nth-of-type(3){animation-delay:1.4s}.item:nth-of-type(4){animation-delay:1.55s}
@keyframes pop{to{opacity:1;transform:none}}
.item i{width:40px;height:40px;border-radius:12px;background:var(--sky);flex:none}
.item:nth-of-type(2) i{background:var(--sky-2)}.item:nth-of-type(3) i{background:var(--ink)}.item:nth-of-type(4) i{background:#d7ecfb}
.item div{flex:1;font-size:12.5px;font-weight:500;line-height:1.3}
.item small{display:block;font-weight:400;color:var(--mute);font-size:10.5px}
.item b{font-size:12px;font-weight:600}

.chip{position:absolute;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:9px;box-shadow:0 18px 40px -20px rgba(10,11,13,.35);transform:translateZ(90px)}
.chip i{width:22px;height:22px;border-radius:7px;background:var(--sky);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700}
.chip.c1{top:0;inset-inline-end:14%;animation:float 6s ease-in-out -1s infinite}
.chip.c2{bottom:92px;inset-inline-start:-18px;animation:float 9s ease-in-out -3s infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -14px}}

@media(max-width:980px){
  .hero{padding-top:118px}
  .hero-grid{grid-template-columns:1fr;gap:40px}
  .stage{height:500px;max-width:520px;margin-inline:auto;width:100%}
}
@media(max-width:480px){.stage{height:470px}.phone{width:200px}.screen{min-height:310px}.chip.c2{inset-inline-start:-6px}}

/* ---------- Marquee ---------- */
.marq{border-block:1px solid var(--line);background:#fff;overflow:hidden;direction:ltr}
.track{display:flex;width:max-content;animation:scroll 40s linear infinite}
.marq:hover .track{animation-play-state:paused}
.track span{display:flex;align-items:center;gap:44px;padding:22px 22px;font-size:15px;color:var(--mute);white-space:nowrap}
.track span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--sky-deep)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* ---------- Sections ---------- */
section{position:relative}
.pad{padding:130px 0}
.head{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:64px}
.head h2{margin-top:18px}
@media(max-width:860px){.head{grid-template-columns:1fr;gap:18px;margin-bottom:44px}.pad{padding:90px 0}}

/* services */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{--mx:50%;--my:50%;position:relative;padding:34px 30px 32px;border-radius:var(--r);border:1px solid var(--line);background:#fff;overflow:hidden;min-height:268px;display:flex;flex-direction:column;transition:transform .5s var(--ease),border-color .3s,box-shadow .5s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx) var(--my),var(--sky-2),transparent 70%);opacity:0;transition:opacity .35s}
.card:hover{transform:translateY(-6px);border-color:rgba(134,200,246,.9);box-shadow:0 30px 60px -34px rgba(60,140,200,.55)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.ico{width:48px;height:48px;border-radius:14px;background:var(--sky);display:grid;place-items:center;margin-bottom:auto;transition:transform .5s var(--ease),background .3s}
.card:hover .ico{transform:rotate(-6deg) scale(1.08);background:var(--ink)}
.card:hover .ico svg{stroke:#fff}
.ico svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.card h3{margin:44px 0 10px}
.card p{color:var(--mute);font-size:15px}
.card.wide{grid-column:span 1}
@media(max-width:980px){.cards{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.cards{grid-template-columns:1fr}.card{min-height:0}}

/* process (dark) */
.dark{background:var(--ink);color:#fff;border-radius:36px;margin-inline:12px;overflow:hidden}
.dark .eyebrow{color:#9aa6b2}
.dark .lead{color:#9aa6b2}
.dark .glow{position:absolute;width:640px;height:640px;border-radius:50%;background:var(--sky);filter:blur(140px);opacity:.16;top:-260px;inset-inline-start:30%;pointer-events:none}
.steps{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.steps::before{content:"";position:absolute;top:21px;inset-inline:0;height:1px;background:rgba(255,255,255,.14)}
.steps .fill{position:absolute;top:21px;inset-inline-start:0;height:1px;width:0;background:var(--sky);transition:width 1.8s var(--ease)}
.steps.in .fill{width:100%}
.step{position:relative;padding-inline-end:28px}
.dot{width:43px;height:43px;border-radius:50%;background:var(--ink);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:13px;font-weight:600;margin-bottom:34px;position:relative;transition:background .4s,color .4s,border-color .4s;direction:ltr}
.steps.in .dot{background:var(--sky);color:var(--ink);border-color:var(--sky)}
.steps.in .step:nth-child(3) .dot{transition-delay:.5s}.steps.in .step:nth-child(4) .dot{transition-delay:1s}.steps.in .step:nth-child(5) .dot{transition-delay:1.5s}
.step h3{margin-bottom:10px;font-size:22px}
.step p{color:#9aa6b2;font-size:15px;max-width:22em}
@media(max-width:860px){
  .steps{grid-template-columns:1fr;gap:38px}
  .steps::before,.steps .fill{display:none}
  .step{display:grid;grid-template-columns:43px 1fr;column-gap:20px}
  .dot{margin:0;grid-row:span 2}
  .step h3{margin-bottom:6px}
}

/* principles */
.pr{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.pr>div{padding:42px 34px 10px 0;border-inline-end:1px solid var(--line);padding-inline-start:34px}
.pr>div:first-child{padding-inline-start:0}
.pr>div:last-child{border-inline-end:0}
.pr .n{font-size:13px;color:var(--mute);margin-bottom:56px;display:block;direction:ltr;text-align:start}
.pr h3{font-size:24px;margin-bottom:12px}
.pr p{color:var(--mute);font-size:15.5px}
@media(max-width:860px){.pr{grid-template-columns:1fr}.pr>div{padding:34px 0;border-inline-end:0;border-bottom:1px solid var(--line);padding-inline-start:0}.pr .n{margin-bottom:22px}}

/* script demo */
.bi{margin-top:100px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bi>div{border-radius:var(--r);padding:38px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between}
.bi .en{background:var(--sky-2);direction:ltr;text-align:left;font-family:'Inter',sans-serif}
.bi .ar{background:var(--ink);color:#fff;direction:rtl;text-align:right;font-family:'IBM Plex Sans Arabic',sans-serif}
.bi small{font-size:12px;opacity:.6;letter-spacing:.08em;text-transform:uppercase}
.bi .ar small{letter-spacing:0}
.bi strong{font-size:clamp(24px,3vw,36px);font-weight:600;line-height:1.25}
.bi .en strong{letter-spacing:-.03em}
@media(max-width:700px){.bi{grid-template-columns:1fr;margin-top:70px}.bi>div{padding:28px;min-height:170px}}

/* CTA */
.cta{padding:30px 0 110px}
.cta-box{position:relative;overflow:hidden;border-radius:36px;background:var(--sky);padding:clamp(48px,8vw,110px) clamp(28px,6vw,90px);text-align:center;isolation:isolate}
.cta-box::before,.cta-box::after{content:"";position:absolute;border-radius:50%;background:#fff;filter:blur(60px);opacity:.55;z-index:-1;animation:drift 16s ease-in-out infinite}
.cta-box::before{width:380px;height:380px;top:-160px;inset-inline-start:-100px}
.cta-box::after{width:300px;height:300px;bottom:-140px;inset-inline-end:-60px;animation-direction:reverse}
.cta-box h2{max-width:14em;margin:0 auto 22px}
.cta-box p{max-width:30em;margin:0 auto 38px;color:#34414d;font-size:18px}
.cta-box .btn-dark{height:58px;padding-inline:34px;font-size:16px}

/* footer */
footer{padding:38px 0 46px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px}
.foot a:hover{color:var(--ink)}

/* floating WhatsApp */
.fab{position:fixed;inset-block-end:22px;inset-inline-end:22px;z-index:60;width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 18px 36px -12px rgba(10,11,13,.5);transform:scale(0);transition:transform .5s var(--ease),background .3s}
.fab.show{transform:scale(1)}
.fab:hover{background:var(--ink-2);transform:scale(1.08)}
.fab svg{width:26px;height:26px}

/* reveal */
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .word>span{transform:none}.item{opacity:1;transform:none}.js .rv{opacity:1;transform:none}
}
</style>
</head>

/* =========================================================
   Behaviour
   ========================================================= */
const root = document.documentElement;
root.classList.add('js');
const $  = (s,c=document)=>c.querySelector(s);
const $$ = (s,c=document)=>[...c.querySelectorAll(s)];

let lang = 'en';
try{
  lang = localStorage.getItem('vantec-lang') ||
         ((navigator.language||'').toLowerCase().startsWith('ar') ? 'ar' : 'en');
}catch(e){}

/* WhatsApp links */
function waLink(){
  const n = String(CONFIG.whatsapp).replace(/\D/g,'');
  return `https://wa.me/${n}?text=${encodeURIComponent(CONFIG.message[lang])}`;
}
function prettyPhone(){
  const n = String(CONFIG.whatsapp).replace(/\D/g,'');
  return '+' + n.replace(/^(\d{3})(\d{3})(\d{3})(\d+)$/,'$1 $2 $3 $4');
}

/* words → animated spans */
function splitWords(el){
  const words = el.textContent.trim().split(/\s+/);
  el.innerHTML = words.map((w,i)=>`<span class="word"><span style="--i:${i}">${w}</span></span>`).join(' ');
}

/* marquee */
const MARQ = {
  en:["Websites","Digital menus","Custom systems","Brand identity","Launch pages","Dashboards","Booking systems","Arabic & English"],
  ar:["مواقع إلكترونية","منيو رقمي","أنظمة مخصصة","هوية بصرية","صفحات إطلاق","لوحات تحكم","أنظمة حجز","عربي وإنجليزي"]
};
function buildMarquee(){
  const set = MARQ[lang].map(t=>`<span>${t}</span>`).join('');
  $('#track').innerHTML = set+set+set+set; // 4 copies, animation shifts by 50%
}

function apply(){
  const d = T[lang];
  root.lang = lang;
  root.dir  = lang==='ar' ? 'rtl' : 'ltr';
  document.title = d.title;
  $$('[data-i18n]').forEach(el=>{
    el.textContent = d[el.dataset.i18n];
    if(el.hasAttribute('data-split')) splitWords(el);
  });
  $('#lang').textContent = lang==='ar' ? 'EN' : 'ع';
  $$('.wa').forEach(a=>a.href = waLink());
  $('#phoneShow').textContent = prettyPhone();
  buildMarquee();
}
apply();
$('#yr').textContent = new Date().getFullYear();

$('#lang').addEventListener('click',()=>{
  lang = lang==='ar' ? 'en' : 'ar';
  try{localStorage.setItem('vantec-lang',lang)}catch(e){}
  document.body.animate([{opacity:1},{opacity:.0},{opacity:1}],{duration:380,easing:'ease'});
  setTimeout(apply,170);
});

/* nav + fab */
const nav = $('#nav'), fab = $('#fab');
function onScroll(){
  const y = scrollY;
  nav.classList.toggle('stuck', y>20);
  fab.classList.toggle('show', y>520);
}
addEventListener('scroll',onScroll,{passive:true}); onScroll();

/* reveal on scroll */
const io = new IntersectionObserver((es)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
},{threshold:.15,rootMargin:'0px 0px -6% 0px'});
$$('.rv, #steps').forEach(el=>io.observe(el));

/* card spotlight */
$$('.card').forEach(c=>{
  c.addEventListener('pointermove',e=>{
    const r=c.getBoundingClientRect();
    c.style.setProperty('--mx',(e.clientX-r.left)+'px');
    c.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
});

/* hero tilt (desktop only) */
const stage=$('#stage'), tilt=$('#tilt');
if(matchMedia('(hover:hover) and (min-width:981px)').matches){
  stage.addEventListener('pointermove',e=>{
    const r=stage.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    tilt.style.transform=`rotateY(${x*9}deg) rotateX(${-y*9}deg)`;
  });
  stage.addEventListener('pointerleave',()=>tilt.style.transform='');
}

/* magnetic buttons */
if(matchMedia('(hover:hover)').matches){
  $$('[data-magnet]').forEach(b=>{
    b.addEventListener('pointermove',e=>{
      const r=b.getBoundingClientRect();
      b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.28}px)`;
    });
    b.addEventListener('pointerleave',()=>b.style.transform='');
  });
}
